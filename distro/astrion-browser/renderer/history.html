<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History — Astrion</title>
  <style>
    :root {
      --bg: #0e0e1a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.08);
      --fg: rgba(255,255,255,0.92);
      --fg-muted: rgba(255,255,255,0.55);
      --fg-faint: rgba(255,255,255,0.35);
      --accent: #5ac8fa;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 30% 20%, rgba(90,200,250,0.06) 0%, transparent 60%),
        var(--bg);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .btn-danger { color: #ff6e6e; }
    .search-bar {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--fg);
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 24px;
      outline: none;
    }
    .search-bar:focus { border-color: var(--accent); background: var(--bg-card-hover); }
    .day-group {
      margin-bottom: 24px;
    }
    .day-label {
      font-size: 10px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--fg-faint);
      font-weight: 600;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .entry:hover {
      background: var(--bg-card-hover);
      border-color: rgba(90,200,250,0.25);
    }
    .entry-time {
      font-size: 11px;
      color: var(--fg-faint);
      font-variant-numeric: tabular-nums;
      width: 56px;
      flex-shrink: 0;
    }
    .entry-info {
      flex: 1;
      min-width: 0;
    }
    .entry-title {
      font-size: 13px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-url {
      font-size: 11px;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--fg-faint);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>History</h1>
      <div class="header-actions">
        <button class="btn btn-danger" id="clear-btn">Clear all history</button>
      </div>
    </header>

    <input class="search-bar" id="search" placeholder="Search history..." autofocus>

    <div id="list"></div>
  </div>

  <script>
    let history = [];

    async function load() {
      if (!window.astrionPage) {
        document.getElementById('list').innerHTML = '<div class="empty">History API not available.</div>';
        return;
      }
      history = await window.astrionPage.listHistory();
      render(history);
    }

    function render(items) {
      const list = document.getElementById('list');
      if (!items.length) {
        list.innerHTML = '<div class="empty">Nothing here yet — pages you visit will appear here.</div>';
        return;
      }

      // Group by date (today / yesterday / older).
      const today = new Date();
      const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
      const startOfYesterday = startOfDay - 24 * 60 * 60 * 1000;

      const groups = { 'Today': [], 'Yesterday': [], 'Earlier': [] };
      for (const e of items) {
        if (e.at >= startOfDay) groups['Today'].push(e);
        else if (e.at >= startOfYesterday) groups['Yesterday'].push(e);
        else groups['Earlier'].push(e);
      }

      list.innerHTML = '';
      for (const label of Object.keys(groups)) {
        if (groups[label].length === 0) continue;
        const group = document.createElement('div');
        group.className = 'day-group';
        group.innerHTML = `<div class="day-label">${label}</div>`;
        for (const e of groups[label]) {
          const row = document.createElement('div');
          row.className = 'entry';
          const t = new Date(e.at);
          const time = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          row.innerHTML = `
            <div class="entry-time">${escapeHtml(time)}</div>
            <div class="entry-info">
              <div class="entry-title">${escapeHtml(e.title || e.url)}</div>
              <div class="entry-url">${escapeHtml(e.url)}</div>
            </div>
          `;
          row.addEventListener('click', () => {
            location.href = e.url;
          });
          group.appendChild(row);
        }
        list.appendChild(group);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return render(history);
      render(history.filter(h =>
        (h.title || '').toLowerCase().includes(q) ||
        (h.url || '').toLowerCase().includes(q)
      ));
    });

    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!confirm('Clear all browser history? This cannot be undone.')) return;
      if (window.astrionPage) {
        await window.astrionPage.clearHistory();
        history = [];
        render(history);
      }
    });

    load();
  </script>
</body>
</html>
