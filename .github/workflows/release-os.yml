name: Release Astrion OS (bootable ISO)

# Publishes the from-scratch kernel as a downloadable astrion.iso.
#
# This is the artifact docs/try-astrion.md tells people to download, and until
# now it did not exist anywhere a stranger could reach: build-kernel.yml uploads
# it as a workflow ARTIFACT, which requires a GitHub account and expires. A
# tester should be able to click one link.
#
# THE RELEASE IS GATED ON THE UI SUITE. Fourteen tests (kernel/tools/uitest.py)
# boot the real kernel in QEMU and drive it — dock, shell, Assistant, editor
# saves, reboot persistence, learned phrasings, a packet on the wire. If any of
# them fails, nothing is published. Shipping a broken ISO to the handful of
# people willing to try an unknown OS costs more than shipping late; most of
# them will never try a second time.
#
# A tag push is THE release and is marked Latest (not a pre-release), because
# releases/latest is the link the README hands out. A manual run defaults to
# pre-release so a test run cannot take that slot by accident.
#
#   Manual:  Actions -> this workflow -> Run workflow -> type a version
#   By tag:  git tag os-v0.3 && git push origin os-v0.3

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label, e.g. 0.3'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'os-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The UI suite gates this job, and its wall-clock is not a stable number:
    # two runs of the same suite on the same machine came in at 6.9 and
    # 39.3 minutes depending on what else was using the CPU (QEMU runs under
    # TCG here, so it is entirely CPU-bound). 45 would have been inside that
    # spread — and a timeout here kills a RELEASE mid-suite, the one run where
    # it costs the most. Kept in step with ui-suite.yml; move both together.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build + emulation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential binutils xorriso mtools \
            qemu-system-x86 grub-pc-bin grub-common python3 python3-numpy

      - name: Work out the version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            # refs/tags/os-v0.3 -> 0.3
            V="${GITHUB_REF#refs/tags/os-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=os-v$V"  >> "$GITHUB_OUTPUT"
          echo "Releasing Astrion OS $V"

      - name: Host tests + header gates
        run: cd kernel && make test

      - name: Build the multiboot2 kernel
        run: cd kernel && make kernel-mb2

      # The gate. `make ui-test` builds the ISO and runs every UI test
      # against it, so a failure here stops the release before anything is
      # published.
      - name: UI suite (gates the release)
        run: cd kernel && make ui-test

      - name: Package the ISO
        id: pkg
        run: |
          cd kernel
          # ui-test already built this from the tested kernel — reuse that exact
          # file rather than rebuilding, so the bytes released are the bytes
          # that passed.
          cp build/astrion-ui.iso astrion.iso
          sha256sum astrion.iso > astrion.iso.sha256
          ls -lh astrion.iso
          cat astrion.iso.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Astrion OS ${{ steps.ver.outputs.version }}
          # Tag push: a real release, marked Latest. Manual run: pre-release
          # unless the box was unticked. github.event.inputs is empty on a
          # tag push, so the comparison below is false there.
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: ${{ github.event.inputs.prerelease != 'true' }}
          files: |
            kernel/astrion.iso
            kernel/astrion.iso.sha256
          body: |
            An operating system written from scratch in C, with the AI built into the kernel. No Linux underneath.

            ```
            qemu-system-x86_64 -cdrom astrion.iso -m 512
            ```

            Download `astrion.iso` below. **[How to run it](https://github.com/${{ github.repository }}/blob/main/docs/try-astrion.md)** — about five minutes in QEMU, VirtualBox or UTM; no spare computer needed.

            ### What works
            A desktop with draggable windows · a Terminal with 52 commands · a text editor that saves to a real filesystem · a file browser · calculator · system monitor · settings · Snake · an Assistant that runs the machine from plain English ("write hello to notes.txt", "how much memory", "set the accent to teal") and **learns how you phrase things**, remembering it across reboots. `net` in the Terminal does ARP, DHCP, ping and DNS on QEMU's virtual card — a driver and a stack, not a browser.

            The Assistant lives inside the kernel and has no path to the network.

            ### What doesn't, yet
            - **This ISO has no brain in it.** The on-device language model loads from a separate boot module that is not shipped here. Ask the Assistant to write a poem and it says "no brain loaded"; every other answer (files, machine, settings) is live.
            - Has never been run on real hardware — emulator only.
            - Cannot be installed to a hard drive.
            - The Assistant is not a chatbot. It runs the machine.

            ### Every build is tested
            Fourteen automated tests boot this exact ISO in QEMU and drive it with a real mouse and keyboard, checking real pixels, real text and, for networking, a packet capture taken from outside the guest. This release does not exist unless all fourteen passed.

            Found a bug? [Open an issue](https://github.com/${{ github.repository }}/issues) — say what you did, what happened, and which emulator you used.

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-evidence
          path: |
            kernel/build/uitest/*.ppm
            kernel/build/uitest/*.log
          retention-days: 30
