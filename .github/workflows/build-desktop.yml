name: Build & Release Astrion OS Desktop App

# MANUAL ONLY since 2026-09-13. This used to fire on every push that touched
# js/ css/ index.html or assets/, and each run created a GitHub Release, so
# the Electron desktop app buried the real product (the from-scratch kernel
# ISO, release-os.yml) under a stack of auto-builds and took the
# releases/latest slot that the README hands out. The web track is frozen
# until Oct 1 (tasks/PLAN-SEPT.md), so nothing is lost by making this a
# button. When it does run, make_latest is false: the kernel ISO keeps
# Latest.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────
  # 0. Tests that need no network and no model. Nothing is built or
  #    released if one of these is red.
  # ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Does the product send the CLOUD privacy clause on the cloud leg?
      # fetch is stubbed; the captured Anthropic request's system message
      # must carry "this turn does leave the user's machine" and not the
      # local "does not leave the machine". The test plants the bug
      # (runtime ignored) and requires itself to go red before passing.
      - name: ai-service cloud clause
        run: npm run test:ai-service
      # The FROM guard on /api/ai/ollama-create: the test imports the same
      # server/modelfile-guard.js the endpoint runs (it used to test a copy of
      # the regex, so loosening the server's copy changed nothing here) and
      # checks index.js has not grown a private regex again.
      - name: ollama-create FROM guard
        run: npm run test:server

  # ───────────────────────────────────────────────
  # 1. Compute a new auto-incrementing version tag
  # ───────────────────────────────────────────────
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: compute
        run: |
          BASE=$(node -p "require('./installer/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Building Astrion OS $VERSION"

  # ───────────────────────────────────────────────
  # 2. Build Mac / Linux / Windows in parallel
  # ───────────────────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version in package.json
        shell: bash
        working-directory: installer
        run: |
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.version='${{ needs.version.outputs.version }}';fs.writeFileSync('./package.json',JSON.stringify(pkg,null,2));"
          echo "package.json version:"
          node -p "require('./package.json').version"

      - name: Copy web app files
        shell: bash
        run: |
          mkdir -p installer/app
          cp index.html installer/app/
          cp -r css installer/app/
          cp -r js installer/app/
          [ -d assets ] && cp -r assets installer/app/ || true

      - name: Install dependencies
        working-directory: installer
        run: npm install

      - name: Build desktop app
        working-directory: installer
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List built files
        shell: bash
        run: ls -la installer/dist/ || echo "no dist dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-${{ matrix.platform }}
          path: |
            installer/dist/*.dmg
            installer/dist/*.exe
            installer/dist/*.AppImage
            installer/dist/*.yml
            installer/dist/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────
  # 3. Create a GitHub Release with all platform builds
  # ───────────────────────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release folder
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \
               -o -name "*.yml" -o -name "*.blockmap" \) \
            -exec cp {} release/ \;
          echo "Files in release:"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Astrion OS ${{ needs.version.outputs.version }}
          body: |
            **Astrion OS ${{ needs.version.outputs.version }}** — desktop app (web desktop track), built from commit ${{ github.sha }}

            This is the Electron build of the web desktop, not the from-scratch kernel. The kernel ISO is the `os-v*` release marked Latest.

            ### Downloads
            - **macOS:** `.dmg`
            - **Windows:** `.exe`
            - **Linux:** `.AppImage`

            The desktop app will auto-update to this version on next launch.
          files: release/*
          draft: false
          prerelease: false
          # Never take the Latest slot from the kernel ISO (release-os.yml).
          make_latest: false
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
